services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - weirdstyle-mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]

  clients:
    build: ./api-python
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    environment:
      SERVICE_NAME: clients
      MONGODB_URL: mongodb://mongodb:27017
      MONGODB_DB: bd_weirdstyle_clients
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      MONGO_TIMEOUT_MS: 5000
    secrets:
      - jwt_secret
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [backend]

  inventory:
    build: ./api-python
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    environment:
      SERVICE_NAME: inventory
      MONGODB_URL: mongodb://mongodb:27017
      MONGODB_DB: bd_weirdstyle_inventory
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      ORDERS_INVENTORY_TOKEN_FILE: /run/secrets/orders_inventory_token
      MONGO_TIMEOUT_MS: 5000
    secrets:
      - jwt_secret
      - orders_inventory_token
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [backend]

  orders:
    build: ./api-python
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    environment:
      SERVICE_NAME: orders
      MONGODB_URL: mongodb://mongodb:27017
      MONGODB_DB: bd_weirdstyle_orders
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      INVENTORY_URL: http://inventory:8000
      PAYMENTS_URL: http://payments:8000
      ORDERS_INVENTORY_TOKEN_FILE: /run/secrets/orders_inventory_token
      ORDERS_PAYMENTS_TOKEN_FILE: /run/secrets/orders_payments_token
      PAYMENTS_ORDERS_TOKEN_FILE: /run/secrets/payments_orders_token
      MONGO_TIMEOUT_MS: 5000
    secrets:
      - jwt_secret
      - orders_inventory_token
      - orders_payments_token
      - payments_orders_token
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [backend]

  payments:
    build: ./api-python
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    environment:
      SERVICE_NAME: payments
      MONGODB_URL: mongodb://mongodb:27017
      MONGODB_DB: bd_weirdstyle_payments
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      PAYMENT_WEBHOOK_SECRET_FILE: /run/secrets/payment_webhook_secret
      ORDERS_URL: http://orders:8000
      PAYMENTS_ORDERS_TOKEN_FILE: /run/secrets/payments_orders_token
      ORDERS_PAYMENTS_TOKEN_FILE: /run/secrets/orders_payments_token
      MONGO_TIMEOUT_MS: 5000
    secrets:
      - jwt_secret
      - payment_webhook_secret
      - payments_orders_token
      - orders_payments_token
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [backend]

  graphql:
    build:
      context: .
      dockerfile: Dockerfile.node
    command: node graphql.js
    environment:
      INVENTORY_URL: http://inventory:8000
      ORDERS_URL: http://orders:8000
      PORT: 4001
      NODE_ENV: development
    depends_on:
      inventory:
        condition: service_healthy
      orders:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [backend]

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.node
    command: node server.js
    environment:
      CLIENTS_URL: http://clients:8000
      INVENTORY_URL: http://inventory:8000
      ORDERS_URL: http://orders:8000
      PAYMENTS_URL: http://payments:8000
      GRAPHQL_INTERNAL_URL: http://graphql:4001/graphql
      PORT: 4000
      CORS_ORIGINS: ${CORS_ORIGINS:-http://127.0.0.1:5500,http://localhost:5500}
    depends_on:
      clients:
        condition: service_healthy
      inventory:
        condition: service_healthy
      orders:
        condition: service_healthy
      payments:
        condition: service_healthy
      graphql:
        condition: service_healthy
    ports:
      - "4000:4000"
    networks: [backend]

networks:
  backend:
    driver: bridge

volumes:
  weirdstyle-mongo:

secrets:
  jwt_secret:
    file: ./.secrets/jwt_secret
  orders_inventory_token:
    file: ./.secrets/orders_inventory_token
  orders_payments_token:
    file: ./.secrets/orders_payments_token
  payments_orders_token:
    file: ./.secrets/payments_orders_token
  payment_webhook_secret:
    file: ./.secrets/payment_webhook_secret
