services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - weirdstyle-mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]

  api:
    build: ./api-python
    restart: unless-stopped
    env_file: .env
    environment:
      MONGODB_URL: mongodb://mongodb:27017
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [backend]

  graphql:
    build:
      context: .
      dockerfile: Dockerfile.node
    command: node graphql.js
    environment:
      API_INTERNAL_URL: http://api:8000
      PORT: 4001
      NODE_ENV: development
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [backend]

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.node
    command: node server.js
    environment:
      API_INTERNAL_URL: http://api:8000
      GRAPHQL_INTERNAL_URL: http://graphql:4001/graphql
      PORT: 4000
      CORS_ORIGINS: http://127.0.0.1:5500,http://localhost:5500
    depends_on:
      graphql:
        condition: service_healthy
    ports:
      - "4000:4000"
    networks: [backend]

networks:
  backend:
    driver: bridge
volumes:
  weirdstyle-mongo:
